# =====================================================================
# Issue sync — GitHub 이슈 ↔ Jira 업무 항목을 등록 · 수정 · 댓글 · 상태 · 담당까지 맞춘다
#
# job 두 개 — 실패하면 job 이름으로 방향을 안다
#   from-github  GitHub 이벤트 → Jira 자동화 규칙 「GitHub -> Jira」(수신 웹후크)
#                opened(사본 등록) · edited · closed · reopened · assigned · unassigned · labeled · unlabeled · 댓글
#   from-jira    Jira 규칙이 workflow_dispatch 로 부른다 → GitHub
#                kind = create(사본 등록) · link(원본에 짝 표시) · edit · transition · comment
#                새 규칙은 kind 에 「|덧붙임」 을 싣는다 — edit|<바뀐 칸,…> · comment|<댓글 id>[|edit] (옛 규칙의 kind 는 옛 동작)
#
# 등록자 줄 — 사본 본문 맨 위 「등록: 이름(@GitHub 아이디)」(GitHub 계정이 없으면 「등록: 이름(Jira)」)
#   사본 작성자는 늘 토큰 주인(github-actions · Jira 규칙)이라 누가 등록했는지를 본문에 남긴다. 사본을 고쳐 원본 쪽으로 보낼 때는 뗀다
# 레이블 — 동기화용 라벨(jira · github · gh-*)은 빼고 양쪽을 맞춘다. Jira 레이블은 띄어쓰기를 못 써 GitHub 라벨의 띄어쓰기는 _ 로 바꾼다
# 닫을 때 — GitHub 닫힘 · Jira 완료 범주면 본문 할 일 「- [ ]」 → 「- [x]」(Jira 설명의 ☐ → ☒ 는 규칙이 한다). 다시 열 때는 그대로
# 상위 — 본문에 「### 상위 에픽 키」 칸이 있으면 Jira → GitHub 때 그 칸을 「[키 · 에픽 이름](링크)」 하나로 맞추고 사본 출처의 「상위 :」 줄은 넣지 않는다
#   (칸이 없으면 출처의 상위 줄). GitHub → Jira 는 칸에서 키만 읽는다 — 키만 써도, 링크여도 된다. 글만 바뀌고 키가 같으면 상위 변경이 아니다
# Jira 상태 — 새 규칙 ⑤가 status 에 「범주|상태 이름|해결」 을 실으면 GitHub 라벨 「jira:<상태 이름>」 하나를 붙인다(옛 jira:* 는 뗀다).
#   해결이 대조표 spaces.<스페이스>.notPlannedResolutions 에 있으면 닫힘 이유 not planned. 옛 규칙(범주만)이면 열림 · 닫힘만
#   jira:* 는 동기화용 라벨 — Jira 레이블로 보내지 않고, GitHub 에서 사람이 붙이거나 떼도 Jira 로 가지 않는다
# 담당 — Jira 담당은 한 명이다. GitHub 담당이 여럿이면 첫 번째만 보내고 실행 요약 · notice 에 알린다
#
# 짝 찾기 (라벨 · 입력값에 기대지 않고 GitHub 안의 표시로 찾는다)
#   GitHub 사본   제목 [JIRA 키] + 라벨 jira        → Jira 가 원본
#   GitHub 원본   본문 끝 <!-- jira:키 --> · 라벨 jira 없음 → Jira 가 사본 (표시는 link 가 넣는다)
#   둘 다 없으면 건너뛴다(짝 없는 이슈 · 등록 직후 link 전)
#
# 쓰는 계정 (방안 A — 대신 쓰는 전용 계정)
#   GitHub 에 쓰기   Secret SYNC_BOT_TOKEN(전용 계정 PAT) — 없으면 GITHUB_TOKEN(github-actions)
#   Jira 에 쓰기     Jira 규칙의 실행 주체(전용 Jira 사용자로 바꿀 수 있다)
#   누가 했는지는 댓글 첫 줄 「○○ 님 GitHub 댓글 / ○○ 님 Jira 댓글」로 남긴다
#
# 반복 막기
#   - 전용 계정(변수 SYNC_BOT_LOGIN)이 일으킨 이벤트는 from-github 가 돌지 않는다
#     (GITHUB_TOKEN 으로 바꾼 것은 GitHub 이 애초에 워크플로를 깨우지 않는다)
#   - 옮겨 단 댓글에는 <!-- sync:jira --> — from-github 가 건너뛴다. 새 규칙이 보낸 댓글은 <!-- sync:jira:<Jira 댓글 id> --> 도 — 댓글 수정이 이것으로 짝을 찾는다
#   - Jira 규칙은 「다른 규칙이 이 규칙을 트리거하도록 허용」을 끈다 — 규칙이 바꾼 Jira 는 GitHub 으로 돌아오지 않는다
#   - 값이 이미 같으면 고치지 않는다
#
# 몰릴 때 — 같은 이슈 · 같은 방향 실행은 concurrency 줄(queue: max)에서 취소 없이 차례로 기다린다
#   (GitHub 기본은 대기 자리 1개 — 새 실행이 오면 앞 대기 실행을 취소해 변경이 사라졌다). 순서는 보장되지 않아 job 안에서 최신 값을 다시 읽는다.
#
# Secrets: JIRA_<<SPACE>>_WEBHOOK_URL · JIRA_<<SPACE>>_WEBHOOK_TOKEN(<<SPACE>> 규칙 「<<PREFIX>> Github -> Jira Issue」 수신 웹후크) · SYNC_BOT_TOKEN(선택)
#   옛 JIRA_WEBHOOK_URL · JIRA_WEBHOOK_TOKEN 은 쓰지 않는다
# Variables: SYNC_BOT_LOGIN(선택 — 전용 계정 아이디)
#
# ★ workflow_dispatch 입력은 지금 10개다 — 늘리지 않고 person · parent 처럼 「a|b」로 묶거나 kind 에 「|덧붙임」 으로 싣는다
#   (옛 규칙이 켜진 채로 머지돼도 깨지지 않게 — 옛 kind 값은 옛 동작).
#   Jira 규칙 본문의 키와 이름이 같아야 한다(모르는 키가 오면 422 — 입력을 먼저 머지한 뒤 Jira 본문에 키를 더한다).
# ★ Jira 가 쥔 PAT(Actions: write)는 workflow_dispatch 가 있는 다른 워크플로도 부를 수 있다 —
#   release.yml 수동 실행은 dry-run 뿐이다. 수동 실행에 실제 job 을 붙이지 않는다.
# ⚠️ 이슈 제목 · 본문 · 댓글 · Jira 입력은 run: 안에 ${{ }} 로 넣지 않는다 — 이벤트 파일 · env 로만 받는다.
# =====================================================================
name: Issue sync

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      kind:
        description: 'create · link · edit · transition · comment (새 규칙은 「종류|덧붙임」)'
        required: true
      key:
        description: 'Jira 키 (예: <<SPACE>>-30)'
        required: true
      number:
        description: 'GitHub 이슈 번호 — link 만'
        required: false
      summary:
        description: '요약'
        required: false
      body:
        description: '설명 또는 댓글 (Jira 위키)'
        required: false
      type:
        description: '업무 유형 이름'
        required: false
      status:
        description: '상태 — 범주 키(new · indeterminate · done) 또는 「범주|상태 이름|해결」 · edit 은 「옛 레이블|새 레이블」'
        required: false
      assignee:
        description: '담당자 accountId'
        required: false
      person:
        description: '댓글 쓴 사람 「accountId|이름」'
        required: false
      parent:
        description: '상위 에픽 「키|요약」 — create · edit (없으면 빈 값 · 「|」)'
        required: false

permissions:
  contents: read
  issues: write

env:
  PANDOC_VERSION: 3.1.11.1
  MAP: .github/github-jira-map.yml

jobs:
  # ===================================================================
  # GitHub → Jira
  # ===================================================================
  from-github:
    if: >-
      github.event_name != 'workflow_dispatch'
      && !github.event.issue.pull_request
      && (vars.SYNC_BOT_LOGIN == '' || github.event.sender.login != vars.SYNC_BOT_LOGIN)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: issue-sync-gh-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max   # 몰려도 취소하지 않고 들어온 순서대로 기다린다(대기 자리 1개 → 최대 100건)
    defaults:
      run:
        shell: bash
    env:
      URL: ${{ secrets.JIRA_<<SPACE>>_WEBHOOK_URL }}
      TOKEN: ${{ secrets.JIRA_<<SPACE>>_WEBHOOK_TOKEN }}
      JIRA_SPACE: <<SPACE>>   # 등록 때 규칙이 티켓을 만드는 스페이스
      GH_TOKEN: ${{ secrets.SYNC_BOT_TOKEN || github.token }}   # 등록자 이름 읽기 · 닫을 때 체크박스
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Decide kind · pair
        id: d
        run: |
          # 상위 에픽 키 — 양식 칸 「### 상위 에픽 키」 를 읽는 함수(Build payload 도 쓴다)
          #   epic_raw: 칸의 첫 글줄(링크면 글자만 · 슬랙에 「적은 값」 으로) · epic_of: 그 칸의 키 모양만 대문자로(「[키 · 이름](링크)」 · 소문자도 받는다)
          cat > "$RUNNER_TEMP/epic.sh" <<'SH'
          epic_raw() { perl -CSD -Mutf8 -0ne 'if (/^###[ \t]*상위 에픽 키[ \t]*\r?\n(.*?)(?=^###[ \t]|\z)/ms) { my ($l) = grep { /\S/ } split /\r?\n/, $1; $l //= ""; $l =~ s/\[((?:\\.|[^\]\\])*)\]\([^)\s]*\)/$1/g; $l =~ s/\\([][])/$1/g; $l =~ s/^\s+|\s+$//g; print substr($l, 0, 80) }'; }
          epic_of()  { perl -CSD -Mutf8 -0ne 'if (/^###[ \t]*상위 에픽 키[ \t]*\r?\n(.*?)(?=^###[ \t]|\z)/ms) { my $s = $1; print uc $1 if $s =~ /\b([A-Za-z][A-Za-z0-9]*-[0-9]+)\b/ }'; }
          has_epic() { grep -qE '^###[[:space:]]*상위 에픽 키'; }
          # 상위가 바뀌었나 — 새 본문 · 옛 본문(글). 키가 있고 같으면 칸 글(링크 · 이름)만 바뀌어도 아니다. 키가 없으면 적은 글이 바뀐 것
          epic_changed() {
            local nk ok; nk=$(printf '%s' "$1" | epic_of); ok=$(printf '%s' "$2" | epic_of)
            [ "$nk" != "$ok" ] && return 0
            [ -z "$nk" ] && [ "$(printf '%s' "$1" | epic_raw)" != "$(printf '%s' "$2" | epic_raw)" ]
          }
          # 동기화가 쓰는 라벨 — 양쪽 레이블 맞추기에서 뺀다(jira:* = Jira 상태 라벨)
          is_sync_label() { case "$1" in jira|github|gh-*|jira:*) return 0 ;; esac; return 1; }
          SH
          . "$RUNNER_TEMP/epic.sh"

          ev="$GITHUB_EVENT_PATH"
          action=$(jq -r '.action' "$ev")
          title=$(jq -r '.issue.title' "$ev")
          body=$(jq -r '.issue.body // ""' "$ev")
          copy=""; jq -e '[.issue.labels[].name] | index("jira")' "$ev" >/dev/null && copy=1

          kind=""
          case "$GITHUB_EVENT_NAME:$action" in
            issues:opened)
              # 라벨 jira = Jira 에서 온 사본 — 다시 보내지 않는다
              if [ -n "$copy" ]; then echo "Jira 사본 — 건너뛴다"; else kind=create; fi ;;
            issues:edited)
              jq -e '.changes.title or .changes.body' "$ev" >/dev/null && kind=edit ;;
            issues:closed)     kind=close ;;
            issues:reopened)   kind=reopen ;;
            issues:assigned|issues:unassigned) kind=assign ;;
            issues:labeled|issues:unlabeled)
              if is_sync_label "$(jq -r '.label.name // ""' "$ev")"; then echo "동기화용 라벨 — 건너뛴다"; else kind=label; fi ;;
            issue_comment:created)
              if jq -e '(.comment.body // "" | contains("<!-- sync:jira -->")) or .comment.user.type == "Bot"' "$ev" >/dev/null; then
                echo "옮겨 온 댓글 · 봇 댓글 — 건너뛴다"
              else
                kind=comment
              fi ;;
          esac

          # 사본은 제목 [JIRA 키] + 라벨 jira 둘 다 — 사람이 제목에 [JIRA 키] 를 쓴 원본(GCJ-C8)을 사본으로 보지 않는다
          key=""; role=""
          if [ -n "$kind" ] && [ "$kind" != create ]; then
            if [[ "$title" =~ ^\[JIRA\ ([A-Z][A-Z0-9]+-[0-9]+)\] ]] && [ -n "$copy" ]; then
              key="${BASH_REMATCH[1]}"; role=copy
            else
              key=$(printf '%s' "$body" | grep -oE '<!-- jira:[A-Z][A-Z0-9]+-[0-9]+ -->' | tail -1 | sed -E 's/<!-- jira:(.*) -->/\1/' || true)
              [ -z "$key" ] || role=original
            fi
            if [ -z "$key" ]; then
              # 사본이 없는 원본 — 틀린 상위 에픽 키로 등록이 멈춘 이슈의 키를 고치면 다시 등록한다
              # (새 양식 이슈 · 본문의 「상위 에픽 키」 칸이 바뀐 수정만. 사본이 이미 있으면 규칙 ①의 레이블 확인이 막는다)
              old=$(jq -r '.changes.body.from // ""' "$ev")
              if [ "$kind" = edit ] && [ -z "$copy" ] && jq -e '.changes.body' "$ev" >/dev/null \
                 && printf '%s' "$body" | has_epic \
                 && epic_changed "$body" "$old"; then
                echo "짝 없음 · 상위 에픽 키가 바뀜 — 다시 등록한다"; kind=create
              else
                echo "짝 없음 — 건너뛴다"; kind=""
              fi
            fi
          fi

          [ -n "$kind" ] || echo "보낼 것 없음"
          { echo "kind=$kind"; echo "key=$key"; echo "role=$role"; } >> "$GITHUB_OUTPUT"
          echo "kind=$kind key=$key role=$role"

      - name: Checkout map
        if: steps.d.outputs.kind != ''
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/github-jira-map.yml
          sparse-checkout-cone-mode: false

      # 러너의 apt pandoc 은 이미지마다 판이 달라 판을 고정한다
      - name: Install pandoc
        if: contains(fromJSON('["create","edit","comment"]'), steps.d.outputs.kind)
        run: |
          deb="$RUNNER_TEMP/pandoc.deb"
          curl -sSL --max-time 60 -o "$deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "$deb" >/dev/null
          pandoc --version | head -1

      - name: Build payload
        if: steps.d.outputs.kind != ''
        env:
          KIND: ${{ steps.d.outputs.kind }}
          KEY: ${{ steps.d.outputs.key }}
          ROLE: ${{ steps.d.outputs.role }}
        run: |
          . "$RUNNER_TEMP/epic.sh"
          ev="$GITHUB_EVENT_PATH"
          acct() { [ -z "$1" ] || L="$1" yq -r '.people[strenv(L)].jiraAccountId // ""' "$MAP"; }
          # Jira 위키 글 안의 @아이디 를 대조표 사람이면 멘션으로
          mention() {
            local t; t=$(cat)
            for login in $(yq -r '.people | keys | .[]' "$MAP"); do
              id=$(acct "$login")
              t=$(printf '%s' "$t" | L="$login" I="$id" perl -pe 's/(?<![\w\/])\@\Q$ENV{L}\E\b/[~accountid:$ENV{I}]/g')
            done
            printf '%s' "$t"
          }
          # GitHub 마크다운 → Jira 위키 (소제목 자동 앵커를 끄고, 남는 빈 {anchor:} 는 지운다)
          tojira() { pandoc -f gfm+hard_line_breaks-gfm_auto_identifiers -t jira --wrap=none | sed -E 's/\{anchor:[^}]*\}//g'; }
          # 등록자 줄 — 「등록: 이름(@아이디)」. 이름은 GitHub 프로필 이름(없으면 아이디)
          reg_line() { local n; n=$(gh api "users/$1" --jq '.name // ""' 2>/dev/null || true); printf '등록: %s(@%s)' "${n:-$1}" "$1"; }
          # 사본 본문 맨 위 등록자 줄을 뗀다(원본 쪽으로 보내지 않는다)
          strip_reg() { perl -CSD -Mutf8 -0pe 's/\A\s*등록: [^\n]*\n+//'; }
          # 담당은 한 명 — Jira 담당 칸은 한 사람뿐이라 GitHub 담당이 여럿이면 첫 번째만 보낸다(정책) · 실행 요약 · notice 로 알린다
          one_assignee_note() {
            local c; c=$(jq '.issue.assignees // [] | length' "$ev")
            [ "$c" -gt 1 ] || return 0
            local msg="Jira 담당은 한 명 — 첫 번째(@$1)만 보낸다(GitHub 담당 ${c}명)"
            echo "::notice::#$number $msg"
            echo "- #$number $msg" >> "$GITHUB_STEP_SUMMARY"
          }

          number=$(jq -r '.issue.number' "$ev")
          title=$(jq -r '.issue.title' "$ev")
          html=$(jq -r '.issue.html_url' "$ev")

          if [ "$KIND" = create ]; then
            # 등록 — 이벤트 그대로 + 변환한 본문 + 대조표 값(bridge). 규칙이 {{webhookData.bridge.*}} 로 읽는다
            opener=$(jq -r '.issue.user.login' "$ev")
            { reg_line "$opener"; printf '\n\n'; jq -r '.issue.body // ""' "$ev" | tojira; } > "$RUNNER_TEMP/body.txt"
            gtype=$(jq -r '.issue.type.name // ""' "$ev")
            first=$(jq -r '.issue.assignees[0].login // ""' "$ev")
            jtype=$(S="$JIRA_SPACE" G="$gtype" yq -r '.spaces[strenv(S)] as $s | ($s.issueTypes[strenv(G)] // $s.default // "작업")' "$MAP")
            reporter=$(acct "$opener")
            assignee=$(acct "$first")
            [ -n "$reporter" ] || echo "::notice::$opener 는 대조표 people 에 없다 — 보고자는 규칙 기본값"
            [ -z "$first" ] || [ -n "$assignee" ] || echo "::notice::담당 $first 는 대조표 people 에 없다 — 담당 없음"
            one_assignee_note "$first"
            startField=$(S="$JIRA_SPACE" yq -r '.spaces[strenv(S)].startDateField // ""' "$MAP")
            startDate=$(TZ=Asia/Seoul date -d "$(jq -r '.issue.created_at' "$ev")" +%F)
            # 상위 에픽 — 규칙 ①이 키를 조회해 있는 에픽이면 사본을 만들고, 없으면(0건) 슬랙으로 알리고 멈춘다
            # 이 스페이스 키 모양이 아니면 epicKey 를 null 로 — 규칙 조회식의 기본값({{…|<<SPACE>>-0}})이 쓰여 0건이 된다
            epicRaw=$(jq -r '.issue.body // ""' "$ev" | epic_raw)
            epicKey=$(jq -r '.issue.body // ""' "$ev" | epic_of)
            if [[ ! "$epicKey" =~ ^${JIRA_SPACE}-[0-9]+$ ]]; then
              echo "::notice::상위 에픽 키 「${epicRaw}」 는 $JIRA_SPACE 키 모양이 아니다 — 규칙이 사본을 만들지 않는다"
              epicKey=""
            fi
            # 다시 등록(짝 없는 원본의 키 수정)도 규칙 ①의 opened 조건을 지나도록 action 을 맞춘다
            jq --rawfile b "$RUNNER_TEMP/body.txt" \
               --arg jt "$jtype" --arg rp "$reporter" --arg as "$assignee" \
               --arg sd "$startDate" --arg sf "$startField" --arg ek "$epicKey" --arg er "$epicRaw" \
               '.issue.body = $b
                | .action = "opened"
                | .bridge = { jiraType: $jt, reporter: $rp, assignee: $as,
                              startDate: $sd, startDateField: $sf,
                              epicKey: (if $ek == "" then null else $ek end), epicRaw: $er,
                              actor: (.sender.login // ""),
                              labels: [ .issue.labels[].name | select((. == "jira" or . == "github" or startswith("gh-") or startswith("jira:")) | not) | gsub("\\s+"; "_") ] }' \
               "$ev" > "$RUNNER_TEMP/payload.json"
            jq '.bridge' "$RUNNER_TEMP/payload.json"
            exit 0
          fi

          summary=""; desc=""; assignee=""; comment=""; op=""; label=""
          case "$KIND" in
            edit)
              # 본문에서 짝 표시 · (사본이면) 맨 위 등록자 줄 · 맨 아래 출처 블록을 뗀다
              jq -r '.issue.body // ""' "$ev" > "$RUNNER_TEMP/body.md"
              perl -0pi -e 's/\n*<!-- jira:[A-Z][A-Z0-9]+-[0-9]+ -->\s*\z//' "$RUNNER_TEMP/body.md"
              if [ "$ROLE" = copy ]; then
                # 지금 Jira 요약 = 사본 출처 줄 「Jira : [키 · 요약](링크)」 의 요약(N2 — 사본 제목의 앞말 task: 등이 Jira 로 새지 않게)
                srcsum=$(K="$KEY" perl -CSD -Mutf8 -ne 'if (/^Jira : \[\Q$ENV{K}\E · (.*)\]\(https?:/) { my $s = $1; $s =~ s/\\([][])/$1/g; print $s; exit }' "$RUNNER_TEMP/body.md")
                perl -0pi -e 's/\n*### 출처\n(?:(?!\n### ).)*\z//s' "$RUNNER_TEMP/body.md"
                strip_reg < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/body2.md"
                summary="${title#\[JIRA $KEY\] }"
                if ! jq -e '.changes.title' "$ev" >/dev/null; then
                  # 제목은 그대로 — Jira 요약도 그대로 보낸다(출처 줄이 없으면 옛 동작)
                  [ -z "$srcsum" ] || summary="$srcsum"
                elif [ -n "$srcsum" ]; then
                  # 제목을 바꿈 — 옛 사본 제목이 「앞말: 옛 요약」 이었으면 그 앞말(워크플로가 붙인 것)을 새 제목에서도 뗀다
                  oldt=$(jq -r '.changes.title.from' "$ev"); oldt="${oldt#\[JIRA $KEY\] }"
                  if [ "$oldt" != "$srcsum" ] && [[ "$oldt" == *": $srcsum" ]]; then pre="${oldt%": $srcsum"}: "; summary="${summary#"$pre"}"; fi
                fi
                desc=$(tojira < "$RUNNER_TEMP/body2.md")
              else
                summary="[GH #$number] $title"
                ft=$(printf '%s' "$title" | sed -e 's/\[/［/g; s/\]/］/g; s/|/｜/g')
                desc=$(reg_line "$(jq -r '.issue.user.login' "$ev")"; printf '\n\n'; tojira < "$RUNNER_TEMP/body.md"; printf '\n\nh3. 출처\nGitHub : [Issue #%s · %s|%s]' "$number" "$ft" "$html")
              fi ;;
            label)
              # 라벨 하나 붙임 · 뗌 — Jira 레이블에 같은 것을 더하거나 뺀다(띄어쓰기는 _)
              op=add; [ "$(jq -r '.action' "$ev")" = unlabeled ] && op=remove
              label=$(jq -r '.label.name' "$ev" | sed -E 's/[[:space:]]+/_/g') ;;
            assign)
              first=$(jq -r '.issue.assignees[0].login // ""' "$ev")
              assignee=$(acct "$first")
              [ -z "$first" ] || [ -n "$assignee" ] || echo "::notice::담당 $first 는 대조표에 없다 — Jira 담당을 비운다"
              one_assignee_note "$first" ;;
            comment)
              who=$(jq -r '.comment.user.login' "$ev")
              text=$(jq -r '.comment.body // ""' "$ev" | tojira | mention)
              comment=$(printf '*%s 님 GitHub 댓글*\n\n%s' "$who" "$text") ;;
          esac

          # 상위 에픽 — 원본 본문의 「상위 에픽 키」 칸이 바뀐 수정만 epicChanged=true. 규칙 ①이 조회해 있으면 상위를 바꾸고, 없으면 슬랙
          #   칸이 「키」 → 「[키 · 이름](링크)」 처럼 글만 바뀌고 키가 같으면 바뀐 것이 아니다(epic_changed)
          epicKey=""; epicRaw=""; epicChanged=false
          if [ "$KIND" = edit ] && [ "$ROLE" = original ] && jq -e '.changes.body' "$ev" >/dev/null; then
            epicRaw=$(jq -r '.issue.body // ""' "$ev" | epic_raw)
            if epic_changed "$(jq -r '.issue.body // ""' "$ev")" "$(jq -r '.changes.body.from // ""' "$ev")"; then
              epicChanged=true
              epicKey=$(jq -r '.issue.body // ""' "$ev" | epic_of)
              [[ "$epicKey" =~ ^${JIRA_SPACE}-[0-9]+$ ]] || epicKey=""
            fi
          fi

          jq -n --arg key "$KEY" --arg kind "$KIND" --arg role "$ROLE" \
                --arg summary "$summary" --arg description "$desc" \
                --arg assignee "$assignee" --arg comment "$comment" --arg op "$op" --arg label "$label" \
                --arg ek "$epicKey" --arg er "$epicRaw" --argjson ec "$epicChanged" \
                --arg actor "$(jq -r '.sender.login // ""' "$ev")" \
            '{key: $key, kind: $kind, role: $role, summary: $summary, description: $description, assignee: $assignee, comment: $comment,
              op: $op, label: $label,
              epicKey: (if $ek == "" then null else $ek end), epicRaw: $er, epicChanged: $ec, actor: $actor}' \
            > "$RUNNER_TEMP/payload.json"
          jq '{key, kind, role, summary, assignee, op, label, epicKey, epicChanged}' "$RUNNER_TEMP/payload.json"

      # 닫으면 본문 할 일을 모두 체크한다 — Jira 설명의 ☐ → ☒ 는 규칙 ①의 close 가 한다. 다시 열 때는 바꾸지 않는다
      - name: Check boxes on close
        if: steps.d.outputs.kind == 'close'
        continue-on-error: true   # 체크에 실패해도 Jira 로 닫힘은 보낸다
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue view "$NUMBER" --json body --jq '.body // ""' > "$RUNNER_TEMP/now.md"
          perl -0pe 's/^([ \t]*(?:[-*+]|\d+[.)])[ \t]+)\[ \](?=[ \t]|$)/$1\[x\]/mg' "$RUNNER_TEMP/now.md" > "$RUNNER_TEMP/checked.md"
          if cmp -s "$RUNNER_TEMP/now.md" "$RUNNER_TEMP/checked.md"; then
            echo "체크할 것 없음"
          else
            gh issue edit "$NUMBER" --body-file "$RUNNER_TEMP/checked.md" >/dev/null
            echo "할 일 체크 — #$NUMBER"
            echo "- #$NUMBER 할 일 모두 체크" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send to Jira automation
        if: steps.d.outputs.kind != ''
        env:
          KIND: ${{ steps.d.outputs.kind }}
        run: |
          [ -n "$URL" ] && [ -n "$TOKEN" ] || { echo "::error::Secrets JIRA_<<SPACE>>_WEBHOOK_URL · JIRA_<<SPACE>>_WEBHOOK_TOKEN 이 없다"; exit 1; }
          # 실패 원인(Missing token · Invalid token 등)이 응답 본문에 온다
          code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/resp.txt" -w '%{http_code}' -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "X-Automation-Webhook-Token: $TOKEN" \
            --data-binary @"$RUNNER_TEMP/payload.json") || code=000
          cat "$RUNNER_TEMP/resp.txt"; echo
          [[ "$code" == 2* ]] || { echo "::error::Jira 응답 $code"; exit 1; }
          echo "- #$(jq -r .issue.number "$GITHUB_EVENT_PATH") → Jira · $KIND · $code" >> "$GITHUB_STEP_SUMMARY"

  # ===================================================================
  # Jira → GitHub
  # ===================================================================
  from-jira:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 같은 키가 연달아 오면 차례로 — 두 번째 create 가 첫 번째 이슈를 보고 건너뛴다
    concurrency:
      group: issue-sync-jira-${{ inputs.key }}
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.SYNC_BOT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      KIND_IN: ${{ inputs.kind }}   # 「종류」 또는 「종류|덧붙임」 — 아래 Check input 이 KIND · EXTRA 로 나눈다
      KEY: ${{ inputs.key }}
      NUMBER_IN: ${{ inputs.number }}
      SUMMARY: ${{ inputs.summary }}
      BODY: ${{ inputs.body }}
      TYPE: ${{ inputs.type }}
      STATUS: ${{ inputs.status }}
      ASSIGNEE: ${{ inputs.assignee }}
      PERSON: ${{ inputs.person }}
      PARENT: ${{ inputs.parent }}
      # 상위가 바뀐 GitHub 원본의 「상위 에픽 키」 칸을 Jira 사본 설명에도 보낸다(규칙 ①의 edit)
      URL: ${{ secrets.JIRA_<<SPACE>>_WEBHOOK_URL }}
      TOKEN: ${{ secrets.JIRA_<<SPACE>>_WEBHOOK_TOKEN }}

    steps:
      - name: Check input · find pair
        id: p
        run: |
          # 아래 검색에 KEY 를 쓰므로 형식부터 막는다
          [[ "$KEY" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]] || { echo "::error::Jira 키 형식이 아니다: $KEY"; exit 1; }
          # kind 는 「종류」(옛 규칙) 또는 「종류|덧붙임」(새 규칙) — 입력이 10개로 꽉 차 덧붙임을 kind 에 싣는다
          #   edit|<바뀐 칸,…>   예 edit|summary,description,   — 비면 옛 동작(본문까지 비교)
          #   comment|<댓글 id>  · comment|<댓글 id>|edit(댓글 수정)
          KIND="${KIND_IN%%|*}"; EXTRA=""
          [[ "$KIND_IN" == *"|"* ]] && EXTRA="${KIND_IN#*|}"
          case "$KIND" in create|link|edit|transition|comment) ;; *) echo "::error::kind 가 아니다: $KIND_IN"; exit 1 ;; esac
          [[ "$EXTRA" =~ ^[A-Za-z0-9,|_-]*$ ]] || { echo "::error::kind 덧붙임 형식이 아니다: $KIND_IN"; exit 1; }
          { echo "KIND=$KIND"; echo "EXTRA=$EXTRA"; echo "NEW_RULE=$([[ "$KIND_IN" == *"|"* ]] && echo 1)"; } >> "$GITHUB_ENV"

          # --search · --label 은 검색 색인이 늦어 방금 만든 이슈를 못 본다 — 생성순 최근 100건에서 찾는다
          gh issue list --state all --limit 100 --json number,title,body,labels > "$RUNNER_TEMP/list.json"
          n=""; role=""; go=""
          case "$KIND" in
            create)
              n=$(jq -r --arg k "$KEY" 'map(select((.body // "" | contains("<!-- jira:" + $k + " -->"))
                    or (.title | startswith("[JIRA " + $k + "]")) or (.title | startswith("[" + $k + "]")))) | .[0].number // empty' "$RUNNER_TEMP/list.json")
              if [ -n "$n" ]; then
                echo "이미 있다: #$n"
                echo "- [$KEY] → 이미 있음 #$n" >> "$GITHUB_STEP_SUMMARY"
              else
                go=1
              fi ;;
            link)
              [[ "$NUMBER_IN" =~ ^[0-9]+$ ]] || { echo "::error::이슈 번호 형식이 아니다: $NUMBER_IN"; exit 1; }
              n="$NUMBER_IN"; go=1 ;;
            *)
              # GitHub 사본(제목 [JIRA 키] + 라벨 jira) → Jira 가 원본
              n=$(jq -r --arg k "$KEY" 'map(select(([.labels[].name] | index("jira")) and (.title | startswith("[JIRA " + $k + "]")))) | .[0].number // empty' "$RUNNER_TEMP/list.json")
              if [ -n "$n" ]; then
                role=jira-original
              else
                # GitHub 원본(본문 끝 표시 · 라벨 jira 없음) → Jira 가 사본
                n=$(jq -r --arg k "$KEY" 'map(select((([.labels[].name] | index("jira")) | not) and (.body // "" | contains("<!-- jira:" + $k + " -->")))) | .[0].number // empty' "$RUNNER_TEMP/list.json")
                [ -z "$n" ] || role=jira-copy
              fi
              if [ -n "$n" ]; then go=1; else echo "짝 없음 — 건너뛴다"; fi ;;
          esac
          { echo "kind=$KIND"; echo "number=$n"; echo "role=$role"; echo "go=$go"; } >> "$GITHUB_OUTPUT"
          echo "kind=$KIND key=$KEY #$n role=$role go=$go"

      - name: Checkout map
        if: steps.p.outputs.go == '1'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/github-jira-map.yml
          sparse-checkout-cone-mode: false

      - name: Install pandoc
        if: steps.p.outputs.go == '1' && contains(fromJSON('["create","edit","comment"]'), steps.p.outputs.kind)
        run: |
          deb="$RUNNER_TEMP/pandoc.deb"
          curl -sSL --max-time 60 -o "$deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "$deb" >/dev/null
          pandoc --version | head -1

      # 사본 제목 · 본문 모양은 create 와 edit 이 같아야 한다 — 한곳에 둔다
      - name: Prepare helpers
        if: steps.p.outputs.go == '1'
        run: |
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          site=$(yq -r '.jira.site' "$MAP")
          # Jira accountId → 대조표 GitHub 아이디
          login_of() { [ -z "$1" ] || A="$1" yq -r '.people // {} | to_entries | map(select(.value.jiraAccountId == strenv(A))) | .[0].key // ""' "$MAP"; }
          # 동기화가 쓰는 라벨 — 양쪽 레이블 맞추기에서 뺀다(jira:* = Jira 상태 라벨)
          is_sync_label() { case "$1" in jira|github|gh-*|jira:*) return 0 ;; esac; return 1; }
          # 등록자 줄 — PERSON 「accountId|이름」 → 「등록: 이름(@아이디)」 · GitHub 계정이 없으면 「등록: 이름(Jira)」 · 비면 빈 글자
          reg_of_person() {
            local a n l; [[ "$PERSON" == *"|"* ]] || return 0
            a="${PERSON%%|*}"; n="${PERSON#*|}"; [ -n "$n" ] || return 0
            l=$(login_of "$a")
            if [ -n "$l" ]; then printf '등록: %s(@%s)' "$n" "$l"; else printf '등록: %s(Jira)' "$n"; fi
          }
          # 위키 · 마크다운 맨 위 등록자 줄을 뗀다(사본 쪽에만 있는 줄 — 원본으로 보내지 않는다)
          strip_reg() { perl -CSD -Mutf8 -0pe 's/\A\s*등록: [^\n]*\n+//'; }
          # 할 일 「- [ ]」 → 「- [x]」
          check_all() { perl -0pe 's/^([ \t]*(?:[-*+]|\d+[.)])[ \t]+)\[ \](?=[ \t]|$)/$1\[x\]/mg'; }
          # Jira 위키 → GitHub 마크다운. Jira 는 한 줄 코드 블록을 {code:js}내용{code} 처럼 줄바꿈 없이 내보내는데
          # pandoc 은 그러면 닫는 {code} 를 못 찾아 뒤 글을 모두 버린다(N5) — 여는 · 닫는 표시 앞뒤에 줄바꿈을 넣고 바꾼다
          fromjira() { perl -0pe 's/(\{(?:code|noformat)(?::[^}\n]*)?\})(?!\n)/$1\n/g; s/(?<!\n)(\{(?:code|noformat)\})/\n$1/g' | pandoc -f jira -t gfm --wrap=none; }
          # 변환 결과가 원문보다 크게 짧은지(공백 뺀 글자 수가 60% 밑) — 짧으면 본문을 덮어쓰지 않는다(원문이 200자 밑이면 검사하지 않음)
          length_ok() { local a b; a=$(perl -CSD -0ne 's/\s//g; print length' "$1"); b=$(perl -CSD -0ne 's/\s//g; print length' "$2"); [ "$a" -lt 200 ] || [ $((b * 10)) -ge $((a * 6)) ]; }
          # GitHub 마크다운 → Jira 위키 (from-github 와 같은 변환)
          tojira() { pandoc -f gfm+hard_line_breaks-gfm_auto_identifiers -t jira --wrap=none | sed -E 's/\{anchor:[^}]*\}//g'; }
          # GitHub 본문 「상위 에픽 키」 칸의 키(대문자) — 칸이 없거나 키가 없으면 빈 글자
          epic_cell() { perl -CSD -Mutf8 -0ne 'if (/^###[ \t]*상위 에픽 키[ \t]*\r?\n(.*?)(?=^###[ \t]|^<!-- jira:|\z)/ms) { my $s = $1; print uc $1 if $s =~ /\b([A-Za-z][A-Za-z0-9]*-[0-9]+)\b/ }'; }
          # 「상위 에픽 키」 칸이 있나 · 칸 글(비교용 — 역슬래시 · 공백 차이는 같다고 본다) · 칸 글 바꾸기(값은 인자 — 한글 이름이 깨지지 않게 -CA)
          has_epic_cell() { grep -qE '^###[[:space:]]*상위 에픽 키'; }
          epic_cell_norm() { perl -CSD -Mutf8 -0ne 'if (/^###[ \t]*상위 에픽 키[ \t]*\r?\n(.*?)(?=^###[ \t]|^<!-- jira:|\z)/ms) { my $s = $1; $s =~ s/\\//g; $s =~ s/\s+/ /g; $s =~ s/^ | $//g; print $s }'; }
          norm_text() { perl -CSDA -Mutf8 -e 'my $s = shift; $s =~ s/\\//g; $s =~ s/\s+/ /g; $s =~ s/^ | $//g; print $s' "$1"; }
          set_epic_cell() { perl -CSDA -Mutf8 -0pe 'BEGIN { $v = shift @ARGV } s/^(###[ \t]*상위 에픽 키[ \t]*\r?\n).*?(?=^###[ \t]|^<!-- jira:|\z)/$1\n$v\n\n/ms' "$1"; }
          # 상위 링크 「[키 · 에픽 이름](https://사이트/browse/키)」 — PARENT 「키|요약」 에서. 키가 없으면 빈 글자 · 이름이 없으면 「[키](링크)」
          epic_link() {
            local pk ps pt; pk="${PARENT%%|*}"; ps=""; [[ "$PARENT" == *"|"* ]] && ps="${PARENT#*|}"
            [[ "$pk" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]] || return 0
            pt=$(printf '%s%s' "$pk" "${ps:+ · $ps}" | sed -E 's/([][])/\\\1/g')
            printf '[%s](https://%s/browse/%s)' "$pt" "$site" "$pk"
          }
          # Jira 업무 유형 → GitHub Type (대조표에 스페이스가 없으면 기본 이름으로)
          gtype_of() {
            local t; t=$(T="$TYPE" S="${KEY%%-*}" yq -r '.spaces[strenv(S)].issueTypes // {} | to_entries | map(select(.value == strenv(T))) | .[0].key // ""' "$MAP")
            [ -n "$t" ] || case "$TYPE" in 버그|Bug) t=Bug ;; 기능|Feature) t=Feature ;; *) t=Task ;; esac
            printf '%s' "$t"
          }
          # GitHub 사본 제목 — [JIRA 키] 앞말: 요약 (요약이 bug: · feat: · task: · blocked: 로 시작하면 앞말을 더하지 않는다)
          copy_title() {
            local p
            if [[ "$SUMMARY" =~ ^(bug|feat|task|blocked):\  ]]; then printf '[JIRA %s] %s' "$KEY" "$SUMMARY"; return; fi
            case "$1" in Bug) p=bug ;; Feature) p=feat ;; *) p=task ;; esac
            printf '[JIRA %s] %s: %s' "$KEY" "$p" "$SUMMARY"
          }
          # GitHub 사본 본문 — 맨 위 등록자 줄(REG) · 설명 · 맨 아래 출처(Jira : [키 · 요약](링크) · 상위 : [에픽 키 · 요약](링크)) · 맨 끝 표시. 링크 글자 안의 [ ] 는 이스케이프한다
          # 설명에 「상위 에픽 키」 칸이 있으면 상위는 그 칸 하나(「[키 · 이름](링크)」)로 — 출처의 「상위 :」 줄은 넣지 않는다(두 번 보이지 않게)
          # 상위 줄은 사람이 보는 안내다 — 짝 찾기는 <!-- jira:키 --> · 제목 [JIRA 키] 만 보고, 사본 수정(role=copy)은 등록자 줄 · 출처 칸째 떼고 Jira 로 보낸다
          copy_body() {
            local lt link incell=""; lt=$(printf '%s · %s' "$KEY" "$SUMMARY" | sed -E 's/([][])/\\\1/g')
            link=$(epic_link)
            if [ -n "${REG:-}" ]; then printf '%s\n\n' "$REG"; fi
            if [ -n "$BODY" ]; then
              printf '%s\n' "$BODY" | strip_reg | fromjira > "$RUNNER_TEMP/cb.md"
              if [ -n "$link" ] && has_epic_cell < "$RUNNER_TEMP/cb.md"; then
                set_epic_cell "$link" < "$RUNNER_TEMP/cb.md" > "$RUNNER_TEMP/cb2.md" && mv "$RUNNER_TEMP/cb2.md" "$RUNNER_TEMP/cb.md"
                incell=1
              fi
              cat "$RUNNER_TEMP/cb.md"; printf '\n'
            fi
            printf '### 출처\n\nJira : [%s](https://%s/browse/%s)\n\n' "$lt" "$site" "$KEY"
            if [ -n "$link" ] && [ -z "$incell" ]; then printf '상위 : %s\n\n' "$link"; fi
            printf '<!-- jira:%s -->\n' "$KEY"
          }
          # STATUS → ST_CAT · ST_NAME · ST_RES. 새 규칙은 「범주|상태 이름|해결」(ST_NEW=1), 옛 규칙은 범주만(ST_NAME 빈 값 — 라벨 안 건드림)
          #   범주 키로 시작하는 「a|…」 만 상태로 본다(edit 의 「옛 레이블|새 레이블」 과 헷갈리지 않게)
          parse_status() {
            ST_CAT="$STATUS"; ST_NAME=""; ST_RES=""; ST_NEW=""
            [[ "$STATUS" =~ ^(new|indeterminate|done|undefined)\| ]] || return 0
            local rest; ST_NEW=1; ST_CAT="${STATUS%%|*}"; rest="${STATUS#*|}"
            if [[ "$rest" == *"|"* ]]; then ST_NAME="${rest%|*}"; ST_RES="${rest##*|}"; else ST_NAME="$rest"; fi
            ST_NAME=$(printf '%s' "$ST_NAME" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g'); ST_RES=$(printf '%s' "$ST_RES" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
          }
          # 해결 이름이 대조표 spaces.<스페이스>.notPlannedResolutions 에 있으면 참 — 닫힘 이유 not planned
          not_planned() { [ -n "$1" ] && [ "$(S="${KEY%%-*}" R="$1" yq -r '.spaces[strenv(S)].notPlannedResolutions // [] | map(select(. == strenv(R))) | length' "$MAP")" -gt 0 ]; }
          # Jira 상태 라벨 「jira:<상태 이름>」 하나로 맞춘다 — 인자: 이슈 번호 · 상태 이름 · 범주(라벨 색). 다른 jira:* 는 뗀다
          #   이름에 쉼표가 있어도 되게 REST 로 붙이고 뗀다 · 라벨 이름은 50자까지
          status_label() {
            local n="$1" want cat="$3" color have l
            want=$(perl -CSDA -e 'my $s = "jira:" . shift; $s =~ s/\s+/ /g; $s =~ s/^\s+|\s+$//g; print substr($s, 0, 50)' "$2")
            [ "$want" != "jira:" ] || return 0
            case "$cat" in new) color=DFE1E6 ;; indeterminate) color=0065FF ;; done) color=36B37E ;; *) color=EDEDED ;; esac
            gh api "repos/$GH_REPO/issues/$n/labels?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/have-status.txt"
            have=""
            while IFS= read -r l; do
              case "$l" in jira:*) ;; *) continue ;; esac
              if [ "$l" = "$want" ]; then have=1; continue; fi
              if gh api -X DELETE "repos/$GH_REPO/issues/$n/labels/$(jq -rn --arg s "$l" '$s | @uri')" >/dev/null; then echo "라벨 -$l"; else echo "::warning::라벨 $l 를 떼지 못했다"; fi
            done < "$RUNNER_TEMP/have-status.txt"
            [ -z "$have" ] || { echo "상태 라벨 같음 ($want)"; return 0; }
            gh label create "$want" --color "$color" --description 'Jira 상태' >/dev/null 2>&1 || true
            if jq -n --arg l "$want" '{labels: [$l]}' | gh api -X POST "repos/$GH_REPO/issues/$n/labels" --input - >/dev/null; then echo "라벨 +$want"; else echo "::warning::라벨 $want 를 붙이지 못했다"; fi
          }
          EOF

      - name: Create copy
        if: steps.p.outputs.go == '1' && steps.p.outputs.kind == 'create'
        run: |
          . "$RUNNER_TEMP/lib.sh"
          gtype=$(gtype_of)
          title=$(copy_title "$gtype")
          REG=$(reg_of_person)   # 새 규칙 ②가 보고자를 person 에 싣는다(옛 규칙이면 빈 값 — 줄 없음)
          copy_body > "$RUNNER_TEMP/body.md"
          echo "--- 본문 ---"; cat "$RUNNER_TEMP/body.md"

          login=$(login_of "$ASSIGNEE")
          [ -z "$ASSIGNEE" ] || [ -n "$login" ] || echo "::notice::담당 $ASSIGNEE 의 GitHub 아이디가 대조표에 없다 — Assignee 를 비운다"
          if [ -n "$login" ] && ! gh api "repos/$GH_REPO/assignees/$login" --silent 2>/dev/null; then
            echo "::warning::담당 $login 은 이 저장소 담당이 될 수 없다(저장소 권한 없음) — Assignee 를 비운다"
            login=""
          fi

          gh label create jira --color 0052CC --description 'Jira 에서 생성' --force >/dev/null
          # gh issue create 에는 Type 옵션이 없어 REST 로 만든다. Type 이 거절되면 Type 없이 다시 만든다
          payload() { jq -n --arg t "$title" --rawfile b "$RUNNER_TEMP/body.md" --arg ty "$1" \
            '{title: $t, body: $b, labels: ["jira"]} + (if $ty == "" then {} else {type: $ty} end)'; }
          n=$(payload "$gtype" | gh api "repos/$GH_REPO/issues" --input - --jq .number) \
            || { echo "::warning::Type $gtype 거절 — Type 없이 다시 만든다"; n=$(payload "" | gh api "repos/$GH_REPO/issues" --input - --jq .number); }

          # 저장소 권한이 없는 사람은 지정이 실패한다 — 이슈는 두고 경고만 남긴다
          if [ -n "$login" ]; then
            gh issue edit "$n" --add-assignee "$login" >/dev/null \
              || echo "::warning::담당 $login 을 넣지 못했다 — #$n Assignee 비어 있음"
          fi
          echo "created #$n"
          # 규칙 ②가 status 에 「범주|상태 이름|해결」 을 실으면 지금 상태 라벨을 붙인다(옛 규칙은 status 없음 — 첫 전환 때 붙는다)
          parse_status
          [ -z "$ST_NAME" ] || status_label "$n" "$ST_NAME" "$ST_CAT" || true
          echo "- [$KEY] → #$n 사본 · Type $gtype · 담당 ${login:-없음}" >> "$GITHUB_STEP_SUMMARY"

      - name: Link original
        if: steps.p.outputs.go == '1' && steps.p.outputs.kind == 'link'
        env:
          NUMBER: ${{ steps.p.outputs.number }}
        run: |
          gh issue view "$NUMBER" --json body > "$RUNNER_TEMP/issue.json"
          if jq -e --arg m "<!-- jira:$KEY -->" '.body // "" | contains($m)' "$RUNNER_TEMP/issue.json" >/dev/null; then
            echo "이미 있다: #$NUMBER ← $KEY"
            exit 0
          fi
          # 원본에는 보이는 출처를 넣지 않는다 — 짝 찾기 · 중복 검사용 표시만 맨 끝에
          {
            jq -r '.body // ""' "$RUNNER_TEMP/issue.json"
            printf '\n\n<!-- jira:%s -->\n' "$KEY"
          } > "$RUNNER_TEMP/body.md"
          gh issue edit "$NUMBER" --body-file "$RUNNER_TEMP/body.md" >/dev/null
          echo "linked #$NUMBER ← $KEY"
          echo "- #$NUMBER ← [$KEY] 짝 표시" >> "$GITHUB_STEP_SUMMARY"

      - name: Edit title · body · assignee
        if: steps.p.outputs.go == '1' && steps.p.outputs.kind == 'edit'
        env:
          NUMBER: ${{ steps.p.outputs.number }}
          ROLE: ${{ steps.p.outputs.role }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          gh issue view "$NUMBER" --json title,body,assignees > "$RUNNER_TEMP/now.json"

          cellchanged=""
          if [ "$ROLE" = jira-original ]; then
            # GitHub 사본 — 등록 때와 같은 제목 · 본문 모양. 등록자 줄은 person(보고자)이 오면 그것, 없으면 지금 사본 맨 위 줄을 지킨다
            title=$(copy_title "$(gtype_of)")
            REG=$(reg_of_person)
            [ -n "$REG" ] || REG=$(jq -r '.body // ""' "$RUNNER_TEMP/now.json" | head -1 | tr -d '\r' | grep -E '^등록: ' || true)
            copy_body > "$RUNNER_TEMP/body.md"
          else
            # GitHub 원본 — 사본 요약의 [GH #n] · 설명 맨 아래 출처 블록을 떼고, 원본 표시는 지킨다
            title=$(printf '%s' "$SUMMARY" | sed -E "s/^\[GH #${NUMBER}\] //")
            jq -j '.body // ""' "$RUNNER_TEMP/now.json" > "$RUNNER_TEMP/now.md"
            if [ -n "$NEW_RULE" ] && [ -n "$EXTRA" ] && [[ ",$EXTRA," != *",description,"* ]]; then
              # 새 규칙이 「설명은 안 바뀜」 이라고 알려 왔다 — 원본 본문은 그대로 두고 아래 「상위 에픽 키」 칸만 맞춘다
              # (Jira 설명을 변환해 덮어쓰면 담당 · 상위 · 제목만 바꿔도 원본 서식이 바뀐다)
              echo "Jira 설명은 그대로(바뀐 칸: $EXTRA) — 원본 본문은 「상위 에픽 키」 칸만 맞춘다"
              cp "$RUNNER_TEMP/now.md" "$RUNNER_TEMP/body.md"
            else
              # 옛 규칙(kind=edit) · 설명이 바뀜 · 바뀐 칸 표시가 빔 — Jira 설명으로 원본 본문을 맞춘다
              [ -z "$NEW_RULE" ] || [ -n "$EXTRA" ] || echo "::notice::바뀐 칸 표시가 비었다 — Jira 설명으로 본문을 맞춘다(옛 동작)"
              printf '%s\n' "$BODY" | strip_reg | perl -0pe 's/\n*h3\. 출처\n(?:(?!\nh\d\. ).)*\z//s' > "$RUNNER_TEMP/desc.txt"
              {
                if [ -s "$RUNNER_TEMP/desc.txt" ]; then fromjira < "$RUNNER_TEMP/desc.txt"; fi
                printf '\n<!-- jira:%s -->\n' "$KEY"
              } > "$RUNNER_TEMP/body.md"
              # 변환이 글을 크게 잃었으면(닫히지 않은 매크로 등) 원본 본문을 덮어쓰지 않는다 — 제목 · 담당은 그대로 맞춘다
              if [ -s "$RUNNER_TEMP/desc.txt" ] && ! length_ok "$RUNNER_TEMP/desc.txt" "$RUNNER_TEMP/body.md"; then
                echo "::warning::Jira 설명 변환 결과가 원문보다 크게 짧다 — 원본 본문을 덮어쓰지 않는다"
                cp "$RUNNER_TEMP/now.md" "$RUNNER_TEMP/body.md"
              fi
            fi
            # 「상위 에픽 키」 칸은 실제 Jira 상위를 따른다 — Jira 에서 상위를 바꾸거나 설명의 키 글자를 고쳐도 원본 본문은 실제 상위 키
            # (칸 한 줄만 바꾸고 나머지 본문은 건드리지 않는다). PARENT 에 요약이 오면 칸은 「[키 · 에픽 이름](링크)」 — 키가 같아도 글이 다르면(이름 바뀜 · 키만 적음) 맞춘다
            # 요약이 없으면(빈 이름) 옛 동작 — 키만 비교해 키를 쓴다
            pk="${PARENT%%|*}"; ps=""; [[ "$PARENT" == *"|"* ]] && ps="${PARENT#*|}"
            if [[ "$pk" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]] && has_epic_cell < "$RUNNER_TEMP/body.md"; then
              if [ -n "$ps" ]; then want=$(epic_link); else want="$pk"; fi
              if [ "$(epic_cell < "$RUNNER_TEMP/body.md")" != "$pk" ] \
                 || { [ -n "$ps" ] && [ "$(epic_cell_norm < "$RUNNER_TEMP/body.md")" != "$(norm_text "$want")" ]; }; then
                set_epic_cell "$want" < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/body-cell.md" && mv "$RUNNER_TEMP/body-cell.md" "$RUNNER_TEMP/body.md"
                [ "$(epic_cell < "$RUNNER_TEMP/body.md")" = "$pk" ] && cellchanged=1
              fi
            fi
          fi

          # 바뀐 것만 고친다 — 끝 공백 · 끝 빈 줄 차이는 같다고 본다
          trim() { sed -e 's/[[:space:]]*$//' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'; }
          oldt=$(jq -r .title "$RUNNER_TEMP/now.json")
          args=(); what=""
          [ "$oldt" = "$title" ] || { args+=(--title "$title"); what="제목"; }
          cmp -s <(jq -r '.body // ""' "$RUNNER_TEMP/now.json" | trim) <(trim < "$RUNNER_TEMP/body.md") || { args+=(--body-file "$RUNNER_TEMP/body.md"); what="${what:+$what · }본문"; }
          if [ ${#args[@]} -gt 0 ]; then gh issue edit "$NUMBER" "${args[@]}" >/dev/null; echo "고침: $what"; else echo "제목 · 본문 같음"; fi

          # 담당 — 대조표에 없거나 저장소 담당이 될 수 없는 사람이면 비운다
          # (GitHub 은 담당 불가 아이디가 섞이면 변경 전체를 거절해 옛 담당이 남는다 — 먼저 확인한다)
          login=$(login_of "$ASSIGNEE")
          if [ -n "$login" ] && ! gh api "repos/$GH_REPO/assignees/$login" --silent 2>/dev/null; then
            echo "::warning::담당 $login 은 이 저장소 담당이 될 수 없다(저장소 권한 없음) — GitHub 담당을 비운다"
            login=""
          fi
          now=$(jq -r '[.assignees[].login] | join(",")' "$RUNNER_TEMP/now.json")
          if [ "$now" != "$login" ]; then
            if jq -n --arg l "$login" '{assignees: (if $l == "" then [] else [$l] end)}' \
                 | gh api -X PATCH "repos/$GH_REPO/issues/$NUMBER" --input - >/dev/null; then
              echo "담당: ${now:-없음} → ${login:-없음}"
            else
              echo "::warning::담당을 바꾸지 못했다 — 그대로 ${now:-없음}"
            fi
          fi
          # 상위가 바뀌어 원본 「상위 에픽 키」 칸을 고쳤으면 Jira 사본 설명의 칸도 맞춘다 — 규칙 ①의 edit 를 그대로 쓴다
          # (원본 본문 → Jira 위키로 설명을 다시 쓴다. GitHub 에서 원본을 고칠 때와 같은 길 · 규칙이 바꾼 것은 GitHub 으로 돌아오지 않는다)
          if [ -n "$NEW_RULE" ] && [ -n "$cellchanged" ]; then
            if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
              echo "::warning::Secrets JIRA_<<SPACE>>_WEBHOOK_URL · JIRA_<<SPACE>>_WEBHOOK_TOKEN 이 없어 Jira 설명의 상위 칸은 그대로다"
            else
              gh issue view "$NUMBER" --json title,body,url,author > "$RUNNER_TEMP/after.json"
              jq -r '.body // ""' "$RUNNER_TEMP/after.json" | perl -0pe 's/\n*<!-- jira:[A-Z][A-Z0-9]+-[0-9]+ -->\s*\z//' > "$RUNNER_TEMP/orig.md"
              at=$(jq -r .title "$RUNNER_TEMP/after.json"); au=$(jq -r .url "$RUNNER_TEMP/after.json"); al=$(jq -r '.author.login' "$RUNNER_TEMP/after.json")
              an=$(gh api "users/$al" --jq '.name // ""' 2>/dev/null || true)
              ft=$(printf '%s' "$at" | sed -e 's/\[/［/g; s/\]/］/g; s/|/｜/g')
              desc=$(printf '등록: %s(@%s)\n\n' "${an:-$al}" "$al"; tojira < "$RUNNER_TEMP/orig.md"; printf '\n\nh3. 출처\nGitHub : [Issue #%s · %s|%s]' "$NUMBER" "$ft" "$au")
              jq -n --arg key "$KEY" --arg summary "[GH #$NUMBER] $at" --arg description "$desc" \
                '{key: $key, kind: "edit", role: "original", summary: $summary, description: $description, assignee: "", comment: "",
                  op: "", label: "", epicKey: null, epicRaw: "", epicChanged: false, actor: "jira-parent"}' > "$RUNNER_TEMP/payload.json"
              code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/resp.txt" -w '%{http_code}' -X POST "$URL" \
                -H 'Content-Type: application/json' -H "X-Automation-Webhook-Token: $TOKEN" \
                --data-binary @"$RUNNER_TEMP/payload.json") || code=000
              if [[ "$code" == 2* ]]; then echo "Jira 설명의 상위 칸 → $pk"; else echo "::warning::Jira 설명의 상위 칸을 보내지 못했다(응답 $code)"; cat "$RUNNER_TEMP/resp.txt"; fi
            fi
          fi

          # 레이블 — 새 규칙 ③이 status 에 「옛 레이블|새 레이블」(띄어쓰기로 나눔)을 싣는다. 바뀐 것만 GitHub 라벨에 더하고 뺀다
          # Jira 레이블 a_b 는 저장소에 「a b」 라벨이 있으면 그것으로 · 없는 라벨은 만든다 · 동기화용 라벨은 건드리지 않는다
          if [ -n "$NEW_RULE" ] && [[ "$STATUS" == *"|"* ]]; then
            read -r -a lfrom <<< "${STATUS%%|*}"; read -r -a lto <<< "${STATUS#*|}"
            gh label list --limit 1000 --json name --jq '.[].name' > "$RUNNER_TEMP/repo-labels.txt"
            gh issue view "$NUMBER" --json labels --jq '.labels[].name' > "$RUNNER_TEMP/have.txt"
            gh_label() { local x; while IFS= read -r x; do [ "${x//[[:space:]]/_}" = "$1" ] && { printf '%s' "$x"; return; }; done < "$RUNNER_TEMP/repo-labels.txt"; printf '%s' "$1"; }
            inlist() { local x n="$1"; shift; for x in "$@"; do [ "$x" = "$n" ] && return 0; done; return 1; }
            for l in "${lto[@]}"; do
              inlist "$l" "${lfrom[@]}" && continue; is_sync_label "$l" && continue
              g=$(gh_label "$l"); grep -qxF -- "$g" "$RUNNER_TEMP/have.txt" && continue
              grep -qxF -- "$g" "$RUNNER_TEMP/repo-labels.txt" || gh label create "$g" --color EDEDED --description 'Jira 레이블' >/dev/null 2>&1 || true
              if gh issue edit "$NUMBER" --add-label "$g" >/dev/null; then echo "라벨 +$g"; else echo "::warning::라벨 $g 를 붙이지 못했다"; fi
            done
            for l in "${lfrom[@]}"; do
              inlist "$l" "${lto[@]}" && continue; is_sync_label "$l" && continue
              g=$(gh_label "$l"); grep -qxF -- "$g" "$RUNNER_TEMP/have.txt" || continue
              if gh issue edit "$NUMBER" --remove-label "$g" >/dev/null; then echo "라벨 -$g"; else echo "::warning::라벨 $g 를 떼지 못했다"; fi
            done
          fi
          echo "- [$KEY] → #$NUMBER 수정" >> "$GITHUB_STEP_SUMMARY"

      - name: Close · reopen
        if: steps.p.outputs.go == '1' && steps.p.outputs.kind == 'transition'
        env:
          NUMBER: ${{ steps.p.outputs.number }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          # status — 옛 규칙 ⑤ 「범주」 · 새 규칙 ⑤ 「범주|상태 이름|해결」(ST_CAT · ST_NAME · ST_RES)
          parse_status
          reason=completed; api_reason=completed
          if [ "$ST_CAT" = done ] && not_planned "$ST_RES"; then reason="not planned"; api_reason=not_planned; fi
          gh issue view "$NUMBER" --json state,stateReason > "$RUNNER_TEMP/state.json"
          state=$(jq -r .state "$RUNNER_TEMP/state.json"); sreason=$(jq -r '.stateReason // ""' "$RUNNER_TEMP/state.json")
          if [ "$ST_CAT" = done ] && [ "$state" = OPEN ]; then
            gh issue close "$NUMBER" --reason "$reason" >/dev/null; echo "닫음 ($reason)"
          elif [ "$ST_CAT" != done ] && [ "$state" = CLOSED ]; then
            gh issue reopen "$NUMBER" >/dev/null; echo "다시 엶"
          elif [ -n "$ST_NEW" ] && [ "$ST_CAT" = done ] && [ "${sreason,,}" != "$api_reason" ]; then
            # 이미 닫혔는데 이유가 다르다(완료 범주 안에서 완료 ↔ 안 함 등) — 이유만 바꾼다
            if jq -n --arg r "$api_reason" '{state: "closed", state_reason: $r}' | gh api -X PATCH "repos/$GH_REPO/issues/$NUMBER" --input - >/dev/null; then
              echo "닫힘 이유: ${sreason:-없음} → $api_reason"
            else
              echo "::warning::닫힘 이유를 바꾸지 못했다 — 그대로 ${sreason:-없음}"
            fi
          else
            echo "상태 같음 ($ST_CAT · $state)"
          fi
          # 새 규칙이면 상태 라벨 「jira:<상태 이름>」 하나 — 옛 규칙(범주만)이면 라벨을 건드리지 않는다
          [ -z "$ST_NAME" ] || status_label "$NUMBER" "$ST_NAME" "$ST_CAT" || true
          # 완료 범주면 본문 할 일을 모두 체크한다(다시 열 때는 그대로) — Jira 설명의 ☐ → ☒ 는 규칙 ⑤가 한다
          if [ "$ST_CAT" = done ]; then
            gh issue view "$NUMBER" --json body --jq '.body // ""' > "$RUNNER_TEMP/now.md"
            check_all < "$RUNNER_TEMP/now.md" > "$RUNNER_TEMP/checked.md"
            if cmp -s "$RUNNER_TEMP/now.md" "$RUNNER_TEMP/checked.md"; then echo "체크할 것 없음"
            else gh issue edit "$NUMBER" --body-file "$RUNNER_TEMP/checked.md" >/dev/null; echo "할 일 모두 체크"; fi
          fi
          echo "- [$KEY] $ST_CAT${ST_NAME:+ · $ST_NAME}${ST_RES:+ · 해결 $ST_RES} → #$NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Add comment
        if: steps.p.outputs.go == '1' && steps.p.outputs.kind == 'comment'
        env:
          NUMBER: ${{ steps.p.outputs.number }}
        run: |
          # kind 덧붙임 — comment|<Jira 댓글 id>(새 규칙 ④) · comment|<id>|edit(새 규칙 ⑥ 댓글 수정). 옛 규칙은 덧붙임 없음
          cid="${EXTRA%%|*}"; mode=""; [[ "$EXTRA" == *"|edit" ]] && mode=edit
          [[ -z "$cid" || "$cid" =~ ^[0-9]+$ ]] || { echo "::error::Jira 댓글 id 형식이 아니다: $EXTRA"; exit 1; }
          if [ "$mode" = edit ] && [ -z "$cid" ]; then echo "::error::댓글 수정에 Jira 댓글 id 가 없다"; exit 1; fi
          . "$RUNNER_TEMP/lib.sh"
          # 멘션 [~accountid:…] → 대조표 @아이디(GitHub 계정 없는 사람은 「이름(Jira)」 글자)
          # 이름에 띄어쓰기가 있을 수 있어 줄 단위로 읽는다
          text="$BODY"
          while IFS= read -r ent; do
            [ -n "$ent" ] || continue
            k="${ent%%=*}"; a="${ent#*=}"
            if [ "${k:0:1}" = "~" ]; then rep="${k:1}(Jira)"; else rep="@$k"; fi
            text=$(printf '%s' "$text" | A="$a" R="$rep" perl -pe 's/\[~accountid:\Q$ENV{A}\E\]/$ENV{R}/g')
          done < <(yq -r '(.people // {} | to_entries | map(.key + "=" + .value.jiraAccountId)) + (.jiraOnly // {} | to_entries | map("~" + .key + "=" + .value.jiraAccountId)) | .[]' "$MAP")
          name=""; [[ "$PERSON" == *"|"* ]] && name="${PERSON#*|}"
          {
            printf '**%s** 님 Jira 댓글\n\n' "${name:-Jira 사용자}"
            printf '%s\n' "$text" | fromjira
            printf '\n<!-- sync:jira -->\n'
            [ -z "$cid" ] || printf '<!-- sync:jira:%s -->\n' "$cid"
          } > "$RUNNER_TEMP/c.md"
          if [ "$mode" = edit ]; then
            # 댓글 수정 — 옮겨 단 GitHub 댓글을 <!-- sync:jira:<id> --> 로 찾아 고친다. 표시가 없는 옛 댓글은 건너뛴다(삭제는 동기화하지 않는다)
            gh api "repos/$GH_REPO/issues/$NUMBER/comments?per_page=100" --paginate > "$RUNNER_TEMP/comments.json"
            gid=$(jq -s -r --arg m "<!-- sync:jira:$cid -->" 'add // [] | map(select(.body // "" | contains($m))) | .[0].id // empty' "$RUNNER_TEMP/comments.json")
            if [ -z "$gid" ]; then
              echo "짝 댓글 없음(Jira 댓글 $cid · 표시 없는 옛 댓글이거나 GitHub 에서 온 댓글) — 건너뛴다"
              echo "- [$KEY] 댓글 수정 → 짝 없음 · 건너뜀" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            trim() { sed -e 's/[[:space:]]*$//' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'; }
            if cmp -s <(jq -s -r --arg i "$gid" 'add | map(select((.id | tostring) == $i)) | .[0].body // ""' "$RUNNER_TEMP/comments.json" | trim) <(trim < "$RUNNER_TEMP/c.md"); then
              echo "댓글 같음 — #$NUMBER 댓글 $gid"; exit 0
            fi
            jq -n --rawfile b "$RUNNER_TEMP/c.md" '{body: $b}' | gh api -X PATCH "repos/$GH_REPO/issues/comments/$gid" --input - >/dev/null
            echo "댓글 수정 → #$NUMBER 댓글 $gid (${name:-Jira 사용자})"
            echo "- [$KEY] 댓글 수정 → #$NUMBER · ${name:-Jira 사용자}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/c.md" >/dev/null
          echo "댓글 → #$NUMBER (${name:-Jira 사용자})"
          echo "- [$KEY] 댓글 → #$NUMBER · ${name:-Jira 사용자}" >> "$GITHUB_STEP_SUMMARY"
