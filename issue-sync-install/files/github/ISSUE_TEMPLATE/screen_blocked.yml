# 화면 구현 멈춤 — CLAUDE.md 「Jira 티켓 작업 — 멈추고 이슈 · 문서를 남기는 경우」의 멈춤 조건에 걸렸을 때.
# 칸은 document/_양식-적용-감사.md 「1. 결정 재요청」을 따른다. 칸 이름이 본문 소제목이 되고 Jira 설명에도 그대로 간다.
name: 화면 구현 멈춤
description: 설계서 · 디자인 불일치 · 결정 필요 · DS 부품 없음으로 화면 구현을 멈출 때
title: "blocked: "
type: Task
labels: ["stop:design-audit"]
body:
  - type: input
    id: screen
    attributes:
      label: 화면
      placeholder: 거래처등록
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: 상위 에픽 키
      description: Jira 상위 항목(에픽) 키 — 화면 에픽이 없는 일은 공통 에픽 키
      placeholder: <<SPACE>>-1
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: 멈춤 이유
      description: 해당하는 것을 모두 고른다 — 한 화면은 이슈 1건으로 묶는다
      multiple: true
      options:
        - 사용자 결정이 필요함
        - 설계서와 화면(디자인)이 다름
        - DS 에 추가해야 함
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: 무엇이 다른가
      description: 어긋난 원천 위치(설계서 절 · 디자인 파일 · 줄)와 내용
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: 지금 상태
      description: 지금 어떻게 두었는지(구현 안 함 · 고정값 등)
  - type: textarea
    id: decision
    attributes:
      label: 결정 요청
      description: 선택지와 각 선택지의 영향
    validations:
      required: true
  - type: textarea
    id: progress
    attributes:
      label: 진행 현황
      description: 멈추기 전까지 한 일 · 남은 일
  - type: textarea
    id: detail
    attributes:
      label: 기술 상세
      description: 적용 감사 · DS 요청 문서 경로, 브랜치
