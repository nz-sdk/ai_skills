# GitHub 이슈 <-> Jira 업무 항목 양방향 동기화 — v2 (REST v3 ADF)
# v1(Jira 자동화 규칙이 GitHub 에 쓰던 방식)에서 같은 파일 이름으로 올린 판이다 — 이름을 바꾸지 않아 Jira 동기화 요청 규칙의 주소
# (…/actions/workflows/issue-sync.yml/dispatches) · 실행 기록 · 문서가 그대로 이어진다.
#
# 실행마다 짝 전체(제목 · 본문 · 이미지 · 첨부 · 멘션 · 레이블 · 유형 · 담당 · 상태 · 세부 필드 · 댓글)를 맞춘다
# — 자세한 방식은 scripts/issue-sync/issue-sync.mjs 머리말. 스페이스별 필드는 scripts/issue-sync/spaces.json.
#
# 짝 표식: 제목 "[JIRA 키]"(=GitHub 이 사본) · 본문 "<!-- jira:키 -->" · Jira 이슈 속성 ghsync(마지막으로 맞춘 값).
#
# 실행:
#   1) issues · issue_comment — GitHub 쪽 변경(사람이 한 것만)
#   2) workflow_dispatch — Jira 동기화 요청 규칙이 jira_key 와 짝 GitHub 번호(github_issue · Jira 속성 ghsync.gh — 짝이 없으면 빈 칸)를 주고 부른다
#
# 누락 · 중복 방지:
#   - 같은 짝의 실행은 concurrency 로 한 줄로 선다(동시에 쓰지 않는다). 줄 이름 = GitHub 번호를 알면 gh-<번호>, 모르면 jira-<키>
#     (동기화 요청 규칙이 GitHub 번호를 함께 보내 잡 하나로 바로 줄을 선다). 기다리는 실행은 취소되지 않고
#     들어온 순서대로 하나씩 돈다(queue: max). 실행마다 짝 전체를 다시 맞춘다.
#   - 바뀐 것이 없으면 아무것도 쓰지 않는다 → 자기가 쓴 결과로 다시 깨어나도 그 자리에서 끝난다.
#
# 반복 방지:
#   - GitHub 쪽: 쓰기는 GITHUB_TOKEN — 새 실행을 만들지 않는다 + 아래 if: 로 봇 이벤트를 건너뜀.
#     예외로 Jira 사본 · 댓글을 등록자 본인 토큰(Secret GH_USER_TOKEN_<아이디>)으로 만들면 그 이벤트로 실행이 한 번 더 돌지만,
#     바뀐 것이 없어 아무것도 쓰지 않고 끝난다.
#   - Jira 쪽: 동기화가 Jira 에 쓴 결과로 동기화 요청 규칙이 다시 깨워도 바뀐 것이 없어 아무것도 쓰지 않고 끝난다.
#     댓글 규칙은 「… 님 GitHub 댓글」 사본에서는 부르지 않고, 댓글 사본은 속성 · 표식으로 원본과 구별해 다시 보내지 않는다.
#
# 사람(멘션 · 담당) 대응: .github/github-jira-map.yml 의 people(GitHub 아이디 → jiraAccountId, report-issue 스킬과 같은 정본)
# Secret: JIRA_BASE_URL · JIRA_EMAIL · JIRA_API_TOKEN · (선택) MENTION_MAP = {"<jira accountId>":"<github 로그인>"} 덧붙임 · (선택) SLACK_WEBHOOK_URL
# Variable(선택): JIRA_PROJECT_KEY — GitHub 에서 새로 등록할 때 쓸 스페이스(없으면 spaces.json 의 스페이스가 하나뿐일 때 그것)
#   · ISSUE_SYNC_RUNS_ON — 러너(JSON). 비우면 GitHub 러너("ubuntu-latest"). 자체 러너는 라벨 배열(예 ["self-hosted","issue-sync"])
#   · SYNC_CREATE_SINCE — 전환 시각(예 2026-12-01T09:00:00+09:00). 그 전에 만든 짝 없는 이슈 · 업무는 고쳐도 반대쪽에 새로 등록하지 않는다
#
# 수동 실행 모드(mode):
#   sync    — 지금처럼 한 짝을 맞춘다
#   preview — 저장소의 짝 전체를 맞춰 보되 아무것도 쓰지 않는다. 쓸 것은 실행 요약(Summary)에 표로 남는다.
#             target_repo 를 주면 그 저장소(공개 · 읽기만)를, spaces 를 주면 그 스페이스 설정(JSON)으로,
#             create_since 를 주면 그 시각에 전환한다고 치고 미리 본다 — v1 → v2 전환 전 점검용
#   adopt   — v1 에서 넘어온 짝마다 짝 기록(Jira 속성)만 남긴다. 제목 · 본문 · 댓글은 쓰지 않는다. 안 돌려도 짝을 처음 맞출 때 저절로 한다

name: 이슈 동기화
# 실행 이름 — Actions 목록에 한 줄로. 방향 · 짝 번호(#129 또는 ISSUE-57) · 계기를 보인다.
#   예) 이슈 동기화 · GitHub → Jira · #129 등록   ·   이슈 동기화 · Jira → GitHub · ISSUE-57
#   방향: issues · issue_comment = GitHub → Jira · workflow_dispatch = direction 으로.  번호 앞에 GitHub · Jira 를 다시 붙이지 않는다(화살표가 쪽을 말한다).
#   계기: issues 는 action(열림=등록 · 수정 · 닫기 · 다시 열기 · 레이블 · 담당 · 유형 · 필드) · issue_comment 는 댓글.
#   dispatch(Jira 요청)는 계기를 붙이지 않는다 — inputs.kind 는 Jira 가 주는 영문 이벤트명이라 제목에 영문이 나오기 때문.
run-name: "이슈 동기화 · ${{ github.event_name == 'workflow_dispatch' && (inputs.direction == 'github-to-jira' && 'GitHub → Jira' || 'Jira → GitHub') || 'GitHub → Jira' }} · ${{ (inputs.github_issue || github.event.issue.number) && format('#{0}', inputs.github_issue || github.event.issue.number) || inputs.jira_key || '' }}${{ github.event_name == 'issue_comment' && ' 댓글' || github.event.action == 'opened' && ' 등록' || github.event.action == 'edited' && ' 수정' || github.event.action == 'closed' && ' 닫기' || github.event.action == 'reopened' && ' 다시 열기' || (github.event.action == 'labeled' || github.event.action == 'unlabeled') && ' 레이블' || (github.event.action == 'assigned' || github.event.action == 'unassigned') && ' 담당' || (github.event.action == 'typed' || github.event.action == 'untyped') && ' 유형' || (github.event.action == 'field_added' || github.event.action == 'field_removed') && ' 필드' || '' }}"

on:
  workflow_dispatch:
    inputs:
      direction:
        description: "수동 실행에서 첫 동기화 때 우선할 쪽(이후에는 스냅숏으로 바뀐 쪽을 찾는다)"
        type: choice
        required: true
        options:
          - jira-to-github
          - github-to-jira
      github_issue:
        description: "GitHub 이슈 번호 — 비우면 jira_key 로 짝을 찾거나 새로 만듦"
        required: false
      jira_key:
        description: "Jira 업무 항목 키(예 ABC-1) — 비우면 github_issue 로 짝을 찾거나 새로 만듦"
        required: false
      kind:
        description: "Jira 규칙이 주는 힌트(기록용)"
        required: false
      mode:
        description: "sync(한 짝 맞추기) · preview(전체 미리보기 — 쓰지 않음) · adopt(v1 짝 기록만)"
        type: choice
        required: false
        default: sync
        options:
          - sync
          - preview
          - adopt
      target_repo:
        description: "preview 에서만 — 미리 볼 다른 저장소(owner/repo · 공개 저장소 · 읽기만)"
        required: false
      spaces:
        description: "preview 에서만 — 그 저장소의 spaces.json 내용(JSON 한 줄)"
        required: false
      create_since:
        description: "preview 에서만 — 전환 시각을 이 값으로 가정(비우면 Variable SYNC_CREATE_SINCE)"
        required: false
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned, typed, untyped, field_added, field_removed]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read  # 레포에 쓰지 않는다(Jira 첨부는 Jira 링크로) · 본문이 가리키는 이 레포 파일만 읽는다

# 설정값(Secret · Variable · 이벤트)은 워크플로 수준에 두지 않고, 쓰는 두 단계(바꾼 사람 확인 · 반대쪽에 반영)에만 둔다
# — 내려받기 · Node · 준비 단계에는 넘어가지 않아 그 단계 기록이 설정값으로 길어지지 않는다. 두 단계의 env 는 같은 내용이다.

jobs:
  sync:
    name: GitHub ↔ Jira 동기화
    # 사람이 한 GitHub 변경 · 수동 실행 · Jira 동기화 요청만(봇 이벤트 · PR 댓글은 건너뜀)
    # opened 이면서 제목이 "[JIRA " 로 시작하는 이벤트는 건너뛴다 — Jira → GitHub 사본을 사람 열쇠로 만들 때 생기는
    # 중복 실행(만든 실행과 opened 실행이 동시에 돎)을 막는다. 사본은 만들 때 제목 [JIRA 키] · 본문 <!-- jira:키 -->.
    if: github.event_name == 'workflow_dispatch' || (github.event.sender.type != 'Bot' && !github.event.issue.pull_request && !(github.event.action == 'opened' && startsWith(github.event.issue.title, '[JIRA ')))
    # 같은 짝은 한 줄로(앞 실행이 끝나야 다음이 돈다). 줄 이름은 받은 값으로 바로 정한다 — GitHub 번호를 알면 gh-<번호>, 모르면 jira-<키>.
    # 짝 기록(Jira 속성 ghsync)이 아직 없는 짝(새 업무 · v1 에서 넘어온 짝)은 Jira 쪽 변경이 jira-<키> 줄에 서서,
    # 같은 때 GitHub 쪽 변경과 줄이 갈릴 수 있다 — 첫 동기화가 속성을 적은 뒤로는 gh-<번호> 로 모인다.
    concurrency:
      # preview · adopt(저장소 전체)는 따로 한 줄
      group: issue-sync-${{ (inputs.mode == 'preview' || inputs.mode == 'adopt') && format('all-{0}', inputs.mode) || (inputs.github_issue || github.event.issue.number) && format('gh-{0}', inputs.github_issue || github.event.issue.number) || format('jira-{0}', inputs.jira_key) }}
      cancel-in-progress: false
      # 기다리는 실행을 취소하지 않고 들어온 순서대로 하나씩 돌린다(기본 single 은 마지막 하나만 남기고 취소).
      # 한 줄에 최대 100개까지 기다리고, 넘으면 그 뒤 실행은 취소된다.
      queue: max
    # 러너 — Variable ISSUE_SYNC_RUNS_ON(JSON). 비우면 GitHub 러너. 자체 러너(Docker 등)는 라벨 배열 —
    # Actions 분을 쓰지 않지만, 러너가 꺼져 있으면 켜질 때까지(최대 24시간) 기다린다.
    runs-on: ${{ fromJSON(vars.ISSUE_SYNC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - name: 내려받기
        uses: actions/checkout@v7
      # Node — 러너 이미지에 없을 수 있어 받는다(자체 러너는 도구 캐시에 남아 다음부터 빠르다)
      - name: Node 준비
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 준비
        working-directory: scripts/issue-sync
        run: npm ci --no-audit --no-fund
      # 누가 바꿨나 — 공용 열쇠로 읽기만 한다(아무것도 쓰지 않음 · continue-on-error · 5분 제한).
      # 방향별 최대 3명의 GitHub 아이디(대문자)를 출력한다:
      #   jira1..3 = GitHub 에서 바꾼 사람 → Jira 에 쓸 때 그 사람 열쇠(JIRA_USER_TOKEN_<아이디>)
      #   gh1..3   = Jira 에서 바꾼 사람 → GitHub 에 쓸 때 그 사람 열쇠(GH_USER_TOKEN_<아이디>)
      # 무엇이 틀려도 이 단계는 잡을 멈추지 않는다 — 출력이 비면 아래 6칸이 빈 값이 되어 모두 공용으로 쓴다.
      # Variable ISSUE_SYNC_USER_KEYS=off 면 이 단계를 건너뛴다(→ 지금처럼 공용).
      - name: 바꾼 사람 확인
        id: who
        if: vars.ISSUE_SYNC_USER_KEYS != 'off'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: scripts/issue-sync
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MENTION_MAP: ${{ secrets.MENTION_MAP }}
          # (선택) 비공개 레포 첨부 내려받기 · 조직 이슈 필드 읽기용 — GITHUB_TOKEN 으로는 404 · 403
          SYNC_BOT_TOKEN: ${{ secrets.SYNC_BOT_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DIRECTION: ${{ inputs.direction }}
          GITHUB_ISSUE: ${{ inputs.github_issue || github.event.issue.number }}
          JIRA_KEY: ${{ inputs.jira_key }}
          SYNC_MODE: ${{ inputs.mode || 'sync' }}
          SYNC_DRY_RUN: ${{ inputs.mode == 'preview' && '1' || '' }}
          SYNC_TARGET_REPO: ${{ inputs.mode == 'preview' && inputs.target_repo || '' }}
          SYNC_SPACES_JSON: ${{ inputs.mode == 'preview' && inputs.spaces || '' }}
          SYNC_CREATE_SINCE: ${{ inputs.mode == 'preview' && inputs.create_since || vars.SYNC_CREATE_SINCE }}
        run: node issue-sync.mjs who
      - name: 반대쪽에 반영
        working-directory: scripts/issue-sync
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MENTION_MAP: ${{ secrets.MENTION_MAP }}
          # (선택) 비공개 레포 첨부 내려받기 · 조직 이슈 필드 읽기용 — GITHUB_TOKEN 으로는 404 · 403
          SYNC_BOT_TOKEN: ${{ secrets.SYNC_BOT_TOKEN }}
          # (선택) 상태 레이블을 한꺼번에 여러 개 반영하지 못했을 때 알릴 Slack Incoming Webhook 주소
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_ACTOR: ${{ github.actor }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DIRECTION: ${{ inputs.direction }}
          GITHUB_ISSUE: ${{ inputs.github_issue || github.event.issue.number }}
          JIRA_KEY: ${{ inputs.jira_key }}
          SYNC_MODE: ${{ inputs.mode || 'sync' }}
          SYNC_DRY_RUN: ${{ inputs.mode == 'preview' && '1' || '' }}
          SYNC_TARGET_REPO: ${{ inputs.mode == 'preview' && inputs.target_repo || '' }}
          SYNC_SPACES_JSON: ${{ inputs.mode == 'preview' && inputs.spaces || '' }}
          SYNC_CREATE_SINCE: ${{ inputs.mode == 'preview' && inputs.create_since || vars.SYNC_CREATE_SINCE }}
          # 사람별 토큰 — 저장소 Secret. <아이디> = GitHub 아이디 대문자(영문 숫자 밖은 _).
          #   GH_USER_TOKEN_<아이디>   (Issues: Read and write)        — Jira → GitHub 쓰기
          #   JIRA_USER_TOKEN_<아이디> (값 = 이메일:범위 지정 토큰)    — GitHub → Jira 쓰기
          # 「누가 바꿨나」 가 고른 사람의 열쇠만 6칸으로 넘긴다. 없는 Secret 은 빈 값이 되어 그 쓰기는 공용으로 간다.
          # 스크립트는 쓰기 직전에 기록을 다시 읽어 작성자가 WHO_KEYS 의 칸에 있을 때만 그 칸의 열쇠를 쓴다(사칭 방지).
          ISSUE_SYNC_USER_KEYS: ${{ vars.ISSUE_SYNC_USER_KEYS }}
          WHO_KEYS: '{"jira1":${{ toJSON(steps.who.outputs.jira1) }},"jira2":${{ toJSON(steps.who.outputs.jira2) }},"jira3":${{ toJSON(steps.who.outputs.jira3) }},"gh1":${{ toJSON(steps.who.outputs.gh1) }},"gh2":${{ toJSON(steps.who.outputs.gh2) }},"gh3":${{ toJSON(steps.who.outputs.gh3) }}}'
          JIRA_USER_TOKEN_1: ${{ secrets[format('JIRA_USER_TOKEN_{0}', steps.who.outputs.jira1)] }}
          JIRA_USER_TOKEN_2: ${{ secrets[format('JIRA_USER_TOKEN_{0}', steps.who.outputs.jira2)] }}
          JIRA_USER_TOKEN_3: ${{ secrets[format('JIRA_USER_TOKEN_{0}', steps.who.outputs.jira3)] }}
          GH_USER_TOKEN_1: ${{ secrets[format('GH_USER_TOKEN_{0}', steps.who.outputs.gh1)] }}
          GH_USER_TOKEN_2: ${{ secrets[format('GH_USER_TOKEN_{0}', steps.who.outputs.gh2)] }}
          GH_USER_TOKEN_3: ${{ secrets[format('GH_USER_TOKEN_{0}', steps.who.outputs.gh3)] }}
        run: node issue-sync.mjs "$SYNC_MODE"
