# DB sub-flow spec — used when the `data_access` capability is selected (in-process only).
#
# Flow:
#   1. Vendor  — mysql | postgresql | h2 | other   (typed name allowed for "other")
#   2. Connection (server-backed vendors only) — existing | docker
#        existing → the user TYPES host/port/db/user/password; generate datasource only, NO compose.
#        docker   → generate datasource (localhost) + docker-compose + init SQL.
#      H2 is embedded → no server/no compose; ask mem | file. "other" → user provides everything; NO compose.
#   3. Generate: driver dep (build.gradle) + spring.datasource (application.yml) + (docker) compose+init / (h2) schema.sql.
#
# {{DB}} = database/schema name (default = sample <name>). {{PW}} = password (default = <DB>1234).

vendors:

  mysql:
    embedded: false
    driver_dep: "runtimeOnly 'com.mysql:mysql-connector-j'"          # version managed by the Spring Boot BOM
    driver_class: com.mysql.cj.jdbc.Driver
    default_port: 3306
    # The three timeZone parameters replace the legacy `serverTimezone`, which Connector/J 9.x renamed to
    # `connectionTimeZone`. They are not cosmetic wherever a java.time instant round-trips through a `timestamp`
    # column — without them the driver shifts it by the server's offset (9 hours in KST). The case that forced
    # this was a token-expiry column round-tripping through jdbc, but the correctness applies to any module
    # storing datetimes, so it is set for every generated project.
    # ★ THE URL FOLLOWS THE CONNECTION MODE. `url` is the DOCKER one: a loopback sidecar with no TLS, where
    # allowPublicKeyRetrieval=true is required (MySQL 8.4 negotiates caching_sha2_password, and over plaintext the
    # driver must fetch the server key). Pointed at a REMOTE server the same two parameters send the password
    # exchange and every row in the clear and accept a key from whoever answers.
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/{{DB}}?useSSL=false&allowPublicKeyRetrieval=true&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
    # existing server (default): TLS required, so no public-key retrieval is needed.
    # ⚠ sslMode=REQUIRED encrypts but does NOT verify the server certificate — it stops passive sniffing, not an
    #   active man-in-the-middle. With a CA available use sslMode=VERIFY_CA (or VERIFY_IDENTITY) plus a trust store.
    url_existing: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/{{DB}}?sslMode=REQUIRED&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
    # existing server WITHOUT TLS — only when the user says so explicitly in step 4. Same parameters as the docker
    # URL; say in the README that the connection is unencrypted.
    url_existing_no_tls: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/{{DB}}?useSSL=false&allowPublicKeyRetrieval=true&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
    docker:
      compose_template: templates/db/docker-compose.mysql.yml.template
      init_template: templates/db/init.mysql.sql.template
      note: "MySQL grants MYSQL_USER ALL PRIVILEGES on MYSQL_DATABASE automatically."

  postgresql:
    embedded: false
    driver_dep: "runtimeOnly 'org.postgresql:postgresql'"
    driver_class: org.postgresql.Driver
    default_port: 5432
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/{{DB}}"
    docker:
      compose_template: templates/db/docker-compose.postgres.yml.template
      init_template: templates/db/init.postgres.sql.template

  h2:
    embedded: true                                                    # no server, no docker
    driver_dep: "runtimeOnly 'com.h2database:h2'"
    driver_class: org.h2.Driver
    modes:
      mem:  "jdbc:h2:mem:{{DB}};DB_CLOSE_DELAY=-1;MODE=LEGACY"        # in-memory; resets on restart
      file: "jdbc:h2:file:./data/{{DB}};MODE=LEGACY"                  # persisted under ./data
    username: sa
    password: ""
    schema_template: templates/db/schema.h2.sql.template              # src/main/resources/schema.sql (Spring auto-runs for embedded DBs)
    note: >-
      H2 is bundled in-process — nothing to start. Spring Boot auto-runs src/main/resources/schema.sql for an
      embedded datasource. Use mem for a throwaway demo, file to persist across restarts.

  other:
    embedded: false
    typed_inputs: [driver_coordinate, driver_class, jdbc_url, username, password]   # user TYPES all of these
    driver_dep: "runtimeOnly '{{driver_coordinate}}'"
    note: >-
      For any other vendor (MariaDB, Oracle, MSSQL, …): the user provides the driver Maven coordinate, the
      driver-class-name, and the JDBC URL. No docker-compose is generated — the user points at their own server.

# Provisioning admin (only when protean.worker.db.auto-provision=true, i.e. worker/container mode):
#   docker DB    → also generate templates/db/init.provision-admin.<mysql|postgres>.sql.template as
#                  init/00-provision-admin.sql (creates the admin account with CREATE DB/USER/GRANT). {{ADMIN_USER}}
#                  / {{ADMIN_PW}} = protean.worker.db.admin-username / admin-password.
#   existing DB  → do NOT generate; print the statements under `provision_admin` below VERBATIM, with the warning.
# A DataSource that ONLY backs the jdbc module-store gets NO items data init (Protean creates its own store tables).

# What the provisioning admin account needs, per vendor. Printed verbatim for an existing server (SKILL.md step 9,
# "provisioning admin") so the generator never composes a GRANT of its own.
provision_admin:
  mysql:
    statements: |
      CREATE USER IF NOT EXISTS '<admin-username>'@'%' IDENTIFIED BY '<admin-password>';
      GRANT ALL PRIVILEGES ON *.* TO '<admin-username>'@'%' WITH GRANT OPTION;
    warning: >-
      protean names each scope database and its account after the scope itself, with no prefix, and grants the
      scope account ALL on that database. The admin therefore has to hold those privileges on every database name
      a scope could take, i.e. on *.* — it can read and change every schema on the instance, and a shorter
      privilege list does not change that while mysql.* stays inside *.*. Put this account on a MySQL instance
      used for provisioning ONLY, never on the one that holds business data or an authorization server. Do not
      let anyone create a scope named after an existing database.
  postgresql:
    statements: |
      CREATE ROLE "<admin-username>" LOGIN PASSWORD '<admin-password>' CREATEDB CREATEROLE;
    warning: >-
      CREATEROLE lets this role create and alter other non-superuser roles. Use a dedicated role for provisioning;
      do not reuse an application or owner role.

# spring.datasource block the skill writes into application.yml (server-backed vendors + other):
#   spring:
#     datasource:
#       url: <vendor.url or typed>
#       driver-class-name: <vendor.driver_class or typed>
#       username: ${DB_USER:{{DB}}}
#       password: <SEE BELOW — depends on the connection mode>
# For H2: url from modes.<mem|file>, driver-class-name org.h2.Driver, username sa, password "".
#
# ★ THE PASSWORD FALLBACK IS DECIDED BY THE CONNECTION MODE. This is the ONE key whose shape is not the same for
# every vendor, and getting it wrong COMMITS A REAL CREDENTIAL to the repository.
#
#   docker            password: ${DB_PASSWORD:{{PW}}}
#                     {{PW}} is a value the SKILL generated (<DB>1234) and also wrote into docker-compose.yml, so
#                     the two must agree and the fallback is throwaway by construction. Safe to publish.
#
#   existing / other  password: ${DB_PASSWORD}          ← NO FALLBACK. Never {{PW}} here.
#                     On these paths {{PW}} is the password the USER TYPED for a server that already exists, i.e.
#                     a live secret. Writing it as a fallback puts it in application.yml, which is committed.
#                     Observed: prototype/nz_trilo was GENERATED with `password: "${DB_PASSWORD:<typed-password>}"`
#                     while prototype/nz_ammon (same skill, same `existing` path) got `password: "${DB_PASSWORD}"`.
#                     Two results from one spec is what this note removes.
#                     ⚠ To be exact about the blast radius: nz_trilo is NOT a git repository, so that value never
#                     left the local disk, and nz_ammon — which IS tracked — happens to carry the safe form. So
#                     nothing was actually leaked. The defect is that WHICH form you get was left to the
#                     generator's judgment, and the unsafe form in a tracked sample is a commit away.
#
# ⚠ AND SAY WHAT NO-FALLBACK DOES *NOT* BUY, because it reads like the OAUTH_ISSUER_URI guarantee and is not:
# an unset DB_PASSWORD does NOT abort startup. spring.datasource.* is bound by the @ConfigurationProperties
# Binder, which leaves an unresolved ${...} in place as a LITERAL STRING (ignoreUnresolvablePlaceholders=true),
# and Hikari connects lazily — so the app starts with a banner and fails at the FIRST QUERY. The early warnings
# are docker-compose.yml's `:?` guard and setup.sh's external-DB check; keep both.
